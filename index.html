<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Search Engine - Offline & SEO Friendly</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4285F4">
</head>
<body>

    <div class="search-container">
        <!-- Google-style Colorful Logo -->
        <h1 class="logo">
            <span style="color: #4285F4;">M</span><span style="color: #EA4335;">y</span><span style="color: #FBBC05;">S</span><span style="color: #4285F4;">e</span><span style="color: #34A853;">a</span><span style="color: #EA4335;">r</span><span style="color: #4285F4;">c</span><span style="color: #34A853;">h</span>
        </h1>

        <!-- Search Form (Searches directly on Google) -->
        <form action="https://www.google.com/search" method="GET" target="_blank">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" placeholder="Search Google or type a URL..." autocomplete="off" required>
            </div>
            
            <!-- Buttons -->
            <div class="button-group">
                <button type="submit">Google Search</button>
                <button type="button" onclick="alert('Service Worker and Offline Mode are active!')">Offline Status</button>
            </div>
        </form>
    </div>

    <!-- Register Service Worker for Offline Capability -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker Registered!', reg.scope))
                    .catch((err) => console.log('Service Worker Failed!', err));
            });
        }
    </script>

</body>
</html>
