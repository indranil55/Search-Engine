<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Offline Search Engine</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4285F4">
</head>
<body>

    <div class="search-container">
        <!-- Google-style Colorful Logo -->
        <h1 class="logo">
            <span style="color: #4285F4;">M</span><span style="color: #EA4335;">y</span><span style="color: #FBBC05;">S</span><span style="color: #4285F4;">e</span><span style="color: #34A853;">a</span><span style="color: #EA4335;">r</span><span style="color: #4285F4;">c</span><span style="color: #34A853;">h</span>
        </h1>

        <!-- Local Search Form -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search saved local database..." autocomplete="off">
        </div>

        <!-- Search Results Section -->
        <div id="resultsContainer" class="results-container"></div>
    </div>

    <!-- Link JavaScript -->
    <script src="script.js"></script>

    <!-- Register Service Worker for Offline Capability -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker Registered!', reg.scope))
                    .catch((err) => console.log('Service Worker Failed!', err));
            });
        }
    </script>

</body>
</html>
